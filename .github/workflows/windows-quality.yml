name: Apply 0034 correction

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-0034-correction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/0034-async-native-consistency
          fetch-depth: 32

      - name: Apply assertion-backed correction
        shell: pwsh
        run: node scripts/apply-0034-correction.mjs

      - name: Preserve permanent workflow and remove temporary inputs
        shell: pwsh
        run: |
          git show c5a0f072af28a41a505f24483684167e22379f42:.github/workflows/windows-quality.yml | Set-Content scripts/windows-quality-hardened.yml -Encoding utf8
          Remove-Item scripts/apply-0034-correction.mjs -Force
          Remove-Item scripts/trigger-0034-frontend-correction.txt -Force -ErrorAction SilentlyContinue

      - name: Commit product correction
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend scripts/apply-0034-correction.mjs scripts/trigger-0034-frontend-correction.txt scripts/windows-quality-hardened.yml
          git diff --cached --check
          git commit -m "0034: correct placeholder freshness and stale save errors"
          git push origin HEAD:audit/0034-async-native-consistency
