name: Apply 0029 component cleanup

on:
  push:
    branches:
      - audit/0029-close-and-small-work-area-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != '0029: remove direct auxiliary hide fallbacks'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/0029-close-and-small-work-area-hardening
          persist-credentials: true

      - name: Apply exact reviewed substitutions
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "src/frontend/src/app/DebugWindow.tsx": [
                  ('import { getCurrentWindow } from "@tauri-apps/api/window";\n', ''),
                  ('''const debugWindow = getCurrentWindow();

async function closeDebugWindow(): Promise<void> {
  try {
    await closeWindow("debug");
  } catch {
    try {
      await debugWindow.hide();
    } catch {
      // The native close handler remains available if both command paths fail.
    }
  }
}
''', '''async function closeDebugWindow(): Promise<void> {
  await closeWindow("debug");
}
'''),
              ],
              "src/frontend/src/app/SettingsWindow.tsx": [
                  ('import { getCurrentWindow } from "@tauri-apps/api/window";\n', ''),
                  ('''const settingsWindow = getCurrentWindow();

async function closeSettingsWindow(): Promise<void> {
  try {
    await closeWindow("settings");
  } catch {
    await settingsWindow.hide();
  }
}
''', '''async function closeSettingsWindow(): Promise<void> {
  await closeWindow("settings");
}
'''),
              ],
              "src/frontend/src/app/HappSetupWindow.tsx": [
                  ('import { getCurrentWindow } from "@tauri-apps/api/window";\n', ''),
                  ('''const happSetupWindow = getCurrentWindow();

async function closeHappSetupWindow(): Promise<void> {
  try {
    await closeWindow("happ-setup");
  } catch {
    try {
      await happSetupWindow.hide();
    } catch {
      // The native close handler remains available if both command paths fail.
    }
  }
}
''', '''async function closeHappSetupWindow(): Promise<void> {
  await closeWindow("happ-setup");
}
'''),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if text.count(old) != 1:
                      raise SystemExit(f"Expected exactly one match in {filename}: {old[:80]!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8", newline="\n")

          test_path = Path("src/frontend/src/lib/window-close-feedback.test.tsx")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace(
              'import { beforeEach, describe, expect, it, vi } from "vitest";',
              'import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";',
          )
          marker = '''  beforeEach(() => {
    vi.clearAllMocks();
    vi.spyOn(console, "error").mockImplementation(() => undefined);
  });
'''
          replacement = marker + '''
  afterEach(() => {
    vi.restoreAllMocks();
  });
'''
          if test.count(marker) != 1:
              raise SystemExit("Expected one test cleanup insertion point")
          test_path.write_text(test.replace(marker, replacement), encoding="utf-8", newline="\n")

          Path(".github/workflows/audit-0029-remove-direct-hide-fallbacks.yml").unlink()

      - name: Commit cleaned sources and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "0029: remove direct auxiliary hide fallbacks"
          git push origin HEAD:audit/0029-close-and-small-work-area-hardening
