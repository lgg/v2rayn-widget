name: Apply 0035 audited patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-0035-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'audit/0035-final-declared-surface-audit'
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: audit/0035-final-declared-surface-audit
          fetch-depth: 2
      - name: Materialize permanent workflows
        shell: pwsh
        run: node scripts/materialize-node24-workflows.mjs
      - name: Publish workflow copies
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/workflows-updated
          git diff --cached --check
          git commit -m "0035: materialize Node 24 workflow revisions"
          git push origin HEAD:audit/0035-final-declared-surface-audit
