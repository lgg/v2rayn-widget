name: Apply 0031 minimized-window follow-up

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-0031-followup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/0031-happ-toggle-lifecycle'
    runs-on: [self-hosted, v2rayn-widget-ci]
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/0031-happ-toggle-lifecycle
          fetch-depth: 1

      - name: Apply exact follow-up replacements
        shell: powershell
        run: ./scripts/apply-0031-followup.ps1

      - name: Remove one-shot follow-up machinery
        shell: powershell
        run: |
          Remove-Item scripts/apply-0031-followup.ps1
          Remove-Item .github/workflows/apply-0031-followup.yml

      - name: Commit follow-up contracts
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "0031: scope minimized probes and lock lifecycle order"
          git push origin HEAD:audit/0031-happ-toggle-lifecycle
