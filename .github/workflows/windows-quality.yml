name: Apply 0033 final hardening

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: apply-0033-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 15

    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/0033-tray-runtime-consistency
          fetch-depth: 2

      - name: Apply exact final hardening
        shell: pwsh
        run: node scripts/run-0033-final-hardening.mjs

      - name: Apply canonical Rust formatting
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/rust-env.ps1" -UseGlobalHomes
          cargo fmt --all --manifest-path src/tauri/Cargo.toml

      - name: Restore permanent workflow and remove one-shot files
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/windows-quality.yml
          Remove-Item scripts/apply-0033-final-hardening.mjs
          Remove-Item scripts/run-0033-final-hardening.mjs
          Remove-Item .github/workflows/apply-0033-final-hardening.yml

      - name: Commit clean product head
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "0033: finalize tray runtime consistency"
          git push origin HEAD:audit/0033-tray-runtime-consistency
