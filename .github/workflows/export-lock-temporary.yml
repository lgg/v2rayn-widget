name: Temporary Exact Lock Patch

on:
  push:
    branches:
      - audit/0045-preserve-profile-catalog-on-command-failure

permissions:
  contents: write

jobs:
  patch-lock:
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Confirm self-hosted runner assignment
        shell: pwsh
        run: |
          if ("${{ runner.environment }}" -ne "self-hosted") {
            throw "Temporary lock patch must run on the self-hosted runner"
          }

      - name: Apply exact audited lock patch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $path = "src/frontend/package-lock.json"
          $text = [System.IO.File]::ReadAllText($path)

          function Replace-ExactlyOnce([string]$inputText, [string]$oldValue, [string]$newValue, [string]$label) {
            $count = ([regex]::Matches($inputText, [regex]::Escape($oldValue))).Count
            if ($count -ne 1) {
              throw "$label expected exactly once, found $count"
            }
            return $inputText.Replace($oldValue, $newValue)
          }

          $alreadyPatched = $text.Contains('"version": "3.3.17"') -and
            $text.Contains('nanoid-3.3.17.tgz') -and
            $text.Contains('"version": "8.5.23"') -and
            $text.Contains('postcss-8.5.23.tgz')
          if ($alreadyPatched) {
            Write-Host "Exact security patch is already present; no commit required."
            exit 0
          }

          $patched = $text
          $patched = Replace-ExactlyOnce $patched '"version": "3.3.16",' '"version": "3.3.17",' 'NanoID version'
          $patched = Replace-ExactlyOnce $patched 'https://registry.npmjs.org/nanoid/-/nanoid-3.3.16.tgz' 'https://registry.npmjs.org/nanoid/-/nanoid-3.3.17.tgz' 'NanoID resolved URL'
          $patched = Replace-ExactlyOnce $patched 'sha512-bzlKTyNJ7+LdGIIwy8ijFpIqEQIvafahV7eYykJ8Cvh42EdJeODoJ6gUJXpQJvej1BddH8OqTXZNE/KfbWAu8Q==' 'sha512-xQLf0A3HOMlgHq0n247/LRuAOYmB7dXJ/DvAxGvsSBij45XtBSmQycu+F8ODbHwns/XyFZagyL1+J0Offw1E0g==' 'NanoID integrity'
          $patched = Replace-ExactlyOnce $patched '"version": "8.5.21",' '"version": "8.5.23",' 'PostCSS version'
          $patched = Replace-ExactlyOnce $patched 'https://registry.npmjs.org/postcss/-/postcss-8.5.21.tgz' 'https://registry.npmjs.org/postcss/-/postcss-8.5.23.tgz' 'PostCSS resolved URL'
          $patched = Replace-ExactlyOnce $patched 'sha512-v4sDNP3fdNiWMfabO7OwOQdOX8TiQSztKyT1Wj0w+j7LDallJThJRBBBmzVGyYj0crMh7jlV4zepPkiNu9UwDQ==' 'sha512-g50586zr4bZmwFiTlflMu8E0bDTb5I5gertgwAKmsdUlTQIhZtunzUlD1WSzwcVWPoAVpsrA6vlfCD7oXvRwgg==' 'PostCSS integrity'

          [System.IO.File]::WriteAllText($path, $patched, [System.Text.UTF8Encoding]::new($false))
          $lock = Get-Content $path -Raw | ConvertFrom-Json -AsHashtable
          if ($lock.packages['node_modules/nanoid'].version -ne '3.3.17') {
            throw "NanoID version verification failed"
          }
          if ($lock.packages['node_modules/postcss'].version -ne '8.5.23') {
            throw "PostCSS version verification failed"
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $encodedBranch = [uri]::EscapeDataString($env:BRANCH)
          $uri = "https://api.github.com/repos/$env:REPOSITORY/contents/$path?ref=$encodedBranch"
          $current = Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
          $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($path))
          $body = @{
            message = "0045: apply exact audited dependency lock"
            content = $content
            sha = $current.sha
            branch = $env:BRANCH
          } | ConvertTo-Json
          Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/contents/$path" -Method Put -Body $body -ContentType "application/json"
