name: Apply 0033 CI storage hardening

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: apply-0033-storage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 15

    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/0033-tray-runtime-consistency
          fetch-depth: 2

      - name: Restore permanent workflow source
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/windows-quality.yml

      - name: Apply assertion-backed storage hardening
        shell: pwsh
        run: node scripts/run-0033-ci-storage-hardening.mjs

      - name: Remove one-shot patch scripts
        shell: pwsh
        run: |
          Remove-Item scripts/apply-0033-ci-storage-hardening.mjs
          Remove-Item scripts/run-0033-ci-storage-hardening.mjs

      - name: Commit permanent CI hardening
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "0033: isolate Rust quality builds from the system drive"
          git push origin HEAD:audit/0033-tray-runtime-consistency
