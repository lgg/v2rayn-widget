name: Apply 0033 final hardening

on:
  push:
    branches:
      - audit/0033-tray-runtime-consistency
    paths:
      - .github/workflows/apply-0033-final-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, v2rayn-widget-ci]
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/0033-tray-runtime-consistency
          fetch-depth: 1

      - name: Apply exact final hardening
        shell: powershell
        run: node scripts/apply-0033-final-hardening.mjs

      - name: Apply canonical Rust formatting
        shell: powershell
        run: cargo fmt --all --manifest-path src/tauri/Cargo.toml

      - name: Remove one-shot patch machinery
        shell: powershell
        run: |
          Remove-Item scripts/apply-0033-final-hardening.mjs
          Remove-Item .github/workflows/apply-0033-final-hardening.yml

      - name: Commit final tray hardening
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "0033: finalize tray runtime consistency"
          git push origin HEAD:audit/0033-tray-runtime-consistency
