name: Apply 0034 teardown fix

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-0034-teardown-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 10

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/0034-async-native-consistency
          fetch-depth: 64

      - name: Preserve permanent workflow
        shell: pwsh
        run: git show 2007e676e4e09d4215856378c4dceff53de28432:.github/workflows/windows-quality.yml | Set-Content scripts/windows-quality-final.yml -Encoding utf8

      - name: Apply teardown fix
        shell: pwsh
        run: node scripts/apply-0034-teardown-fix.mjs

      - name: Remove one-shot script
        shell: pwsh
        run: Remove-Item scripts/apply-0034-teardown-fix.mjs -Force

      - name: Commit permanent test fix without workflow mutation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/src/app/DebugWindow.test.tsx src/frontend/src/app/HappSetupWindow.test.tsx scripts/windows-quality-final.yml scripts/apply-0034-teardown-fix.mjs
          git diff --cached --check
          git commit -m "0034: wrap teardown language updates in act"
          git push origin HEAD:audit/0034-async-native-consistency
