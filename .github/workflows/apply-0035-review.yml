name: Apply 0035 final review

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-0035-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'audit/0035-final-declared-surface-audit'
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: audit/0035-final-declared-surface-audit
          fetch-depth: 2
      - name: Prepare nested review patch literals
        shell: pwsh
        run: |
          $path = "scripts/apply-0035-review.mjs"
          $script = [System.IO.File]::ReadAllText($path)
          $expressions = @(
            'new Date().toLocaleTimeString()',
            'line',
            'line.trim()',
            'label',
            'formatSnapshot(snapshot)',
            'error instanceof Error ? error.message : String(error)',
            'title',
            'typeof result === "string" ? result : "done"',
            'message',
            'match[1]',
            'expected'
          )
          foreach ($expression in $expressions) {
            $script = $script.Replace('${' + $expression + '}', '\${' + $expression + '}')
          }
          $needle = 'return "probe complete";'
          $index = $script.LastIndexOf($needle)
          if ($index -lt 0) { throw "Could not find the manual probe return assertion" }
          $script = $script.Substring(0, $index) + 'return result.note;' + $script.Substring($index + $needle.Length)
          [System.IO.File]::WriteAllText($path, $script)
      - name: Apply review corrections
        shell: pwsh
        run: node scripts/apply-0035-review.mjs
      - name: Verify workflow contracts
        shell: pwsh
        run: node scripts/test-workflow-contracts.mjs
      - name: Verify frontend
        working-directory: src/frontend
        shell: pwsh
        run: |
          $env:NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"
          $env:NPM_CONFIG_CACHE = Join-Path $env:RUNNER_TEMP "npm-0035-review-cache"
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Publish clean review corrections
        shell: pwsh
        run: |
          Remove-Item scripts/apply-0035-review.mjs -Force
          Remove-Item scripts/trigger-0035-review.txt -Force -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/apply-0035-review.yml
          git diff --cached --check
          git commit -m "0035: close final audit invariants"
          git push origin HEAD:audit/0035-final-declared-surface-audit
      - name: Cleanup frontend files
        if: always()
        shell: pwsh
        run: |
          Remove-Item "src/frontend/node_modules" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "src/frontend/dist" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP "npm-0035-review-cache") -Recurse -Force -ErrorAction SilentlyContinue
