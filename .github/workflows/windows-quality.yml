name: Inspect 0033 runner storage

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: inspect-0033-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 15

    steps:
      - name: Remove stale project build artifacts and inspect drives
        shell: pwsh
        run: |
          $runnerRoot = Join-Path $env:USERPROFILE ".homerun\runners"
          if (Test-Path $runnerRoot) {
            Get-ChildItem $runnerRoot -Directory | ForEach-Object {
              $repoRoot = Join-Path $_.FullName "_work\v2rayn-widget\v2rayn-widget"
              foreach ($relative in @(
                "src\tauri\target",
                "src\frontend\node_modules",
                "src\frontend\dist"
              )) {
                $candidate = Join-Path $repoRoot $relative
                if (Test-Path $candidate) {
                  Write-Host "Removing $candidate"
                  Remove-Item $candidate -Recurse -Force -ErrorAction Stop
                }
              }
            }
          }

          Get-PSDrive -PSProvider FileSystem |
            Sort-Object Free -Descending |
            ForEach-Object {
              $freeGb = [math]::Round($_.Free / 1GB, 2)
              $usedGb = [math]::Round($_.Used / 1GB, 2)
              Write-Host "DRIVE $($_.Name): root=$($_.Root) free=$freeGb GB used=$usedGb GB"
            }

      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/0033-tray-runtime-consistency
          fetch-depth: 2

      - name: Restore permanent workflow
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/windows-quality.yml

      - name: Commit workflow restoration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/windows-quality.yml
          git diff --cached --check
          git commit -m "0033: restore quality workflow after storage inspection"
          git push origin HEAD:audit/0033-tray-runtime-consistency
