name: Apply 0034 async native audit

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: apply-0034-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 20

    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/0034-async-native-consistency
          fetch-depth: 2

      - name: Restore permanent Release Quality source
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/windows-quality.yml

      - name: Expand assertion-backed patch
        shell: pwsh
        run: |
          $input = [System.IO.File]::OpenRead("scripts/apply-0034.mjs.gz")
          try {
            $gzip = [System.IO.Compression.GZipStream]::new($input, [System.IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [System.IO.File]::Create("scripts/apply-0034.mjs")
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }

      - name: Apply audited changes
        shell: pwsh
        run: node scripts/apply-0034.mjs

      - name: Format Rust workspace
        working-directory: src/tauri
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/rust-env.ps1" -UseGlobalHomes
          cargo fmt --all

      - name: Remove one-shot patch payload
        shell: pwsh
        run: |
          Remove-Item scripts/apply-0034.mjs -Force
          Remove-Item scripts/apply-0034.mjs.gz -Force

      - name: Commit clean implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "0034: harden async native consistency"
          git push origin HEAD:audit/0034-async-native-consistency
