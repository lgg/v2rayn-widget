name: Apply 0031 final architecture wording

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-0031-evidence-doc-wording.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/0031-final-evidence'
    runs-on: [self-hosted, v2rayn-widget-ci]
    steps:
      - name: Checkout exact evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/0031-final-evidence
          fetch-depth: 1

      - name: Apply exact terminology correction
        shell: powershell
        run: ./scripts/apply-0031-evidence-doc-wording.ps1

      - name: Remove one-shot correction machinery
        shell: powershell
        run: |
          Remove-Item scripts/apply-0031-evidence-doc-wording.ps1
          Remove-Item .github/workflows/apply-0031-evidence-doc-wording.yml

      - name: Commit documentation correction
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "0031: align minimized probe terminology"
          git push origin HEAD:audit/0031-final-evidence
