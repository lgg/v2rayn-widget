name: Apply 0034 final cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-0034-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/0034-async-native-consistency
          fetch-depth: 64

      - name: Preserve permanent workflow
        shell: pwsh
        run: git show 39b99e8039427eb9b206bf79e68eae49b5982c37:.github/workflows/windows-quality.yml | Set-Content scripts/windows-quality-final.yml -Encoding utf8

      - name: Apply final cleanup
        shell: pwsh
        run: node scripts/apply-0034-final-cleanup.mjs

      - name: Format Rust workspace
        working-directory: src/tauri
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/rust-env.ps1" -UseGlobalHomes
          cargo fmt --all

      - name: Remove one-shot script
        shell: pwsh
        run: Remove-Item scripts/apply-0034-final-cleanup.mjs -Force

      - name: Commit permanent changes without workflow mutation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend src/tauri scripts/test-workflow-contracts.mjs scripts/windows-quality-final.yml project-tracking/tasks/0034-async-native-consistency.md project-tracking/reports/0034-async-native-consistency-report.md scripts/apply-0034-final-cleanup.mjs
          git diff --cached --check
          git commit -m "0034: make final verification warning-free"
          git push origin HEAD:audit/0034-async-native-consistency
