name: Clean 0033 runner workspace

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: clean-0033-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 15

    steps:
      - name: Remove stale project build artifacts
        shell: pwsh
        run: |
          $runnerRoot = Join-Path $env:USERPROFILE ".homerun\runners"
          if (Test-Path $runnerRoot) {
            Get-ChildItem $runnerRoot -Directory | ForEach-Object {
              $repoRoot = Join-Path $_.FullName "_work\v2rayn-widget\v2rayn-widget"
              foreach ($relative in @(
                "src\tauri\target",
                "src\frontend\node_modules",
                "src\frontend\dist"
              )) {
                $candidate = Join-Path $repoRoot $relative
                if (Test-Path $candidate) {
                  Write-Host "Removing $candidate"
                  Remove-Item $candidate -Recurse -Force -ErrorAction Stop
                }
              }
              Get-ChildItem $repoRoot -Filter "*-output.txt" -File -Recurse -ErrorAction SilentlyContinue |
                Remove-Item -Force -ErrorAction SilentlyContinue
            }
          }

          $drive = Get-PSDrive -Name C
          $freeGb = [math]::Round($drive.Free / 1GB, 2)
          Write-Host "Free space after project cleanup: $freeGb GB"
          if ($drive.Free -lt 8GB) {
            throw "Project-scoped cleanup left less than 8 GB free on C:"
          }

      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/0033-tray-runtime-consistency
          fetch-depth: 2

      - name: Restore permanent workflow
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/windows-quality.yml

      - name: Commit clean workflow restoration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/windows-quality.yml
          git diff --cached --check
          git commit -m "0033: restore quality workflow after runner cleanup"
          git push origin HEAD:audit/0033-tray-runtime-consistency
