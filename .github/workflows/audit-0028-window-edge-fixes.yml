name: Audit 0028 Window Edge Fixes

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: audit-0028-window-edges-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-window-edge-fixes:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/0028-product-surface-completeness'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: audit/0028-product-surface-completeness
          fetch-depth: 0
          show-progress: false

      - name: Apply exact reviewed edge fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_once(
              'src/tauri/src/commands/mod.rs',
              '''        window.show().map_err(|error| error.to_string())?;
                  window.unminimize().map_err(|error| error.to_string())?;
                  window.set_focus().map_err(|error| error.to_string())?;
                  return Ok(());
          ''',
              '''        window.show().map_err(|error| error.to_string())?;
                  window.unminimize().map_err(|error| error.to_string())?;
                  window_position::fit_window_to_current_work_area(&window)?;
                  window.set_focus().map_err(|error| error.to_string())?;
                  return Ok(());
          ''',
          )

          replace_once(
              'src/tauri/src/main.rs',
              '''                "debug" => {
                              if let WindowEvent::CloseRequested { api, .. } = event {
                                  api.prevent_close();
                                  if let Err(error) = window.hide() {
                                      warn!(?error, "failed to hide debug window");
                                  }
                              }
                          }
          ''',
              '''                "debug" => {
                              if let WindowEvent::CloseRequested { api, .. } = event {
                                  api.prevent_close();
                                  let app_handle = app.clone();
                                  tauri::async_runtime::spawn(async move {
                                      if let Err(error) = commands::close_window(
                                          "debug".to_owned(),
                                          app_handle,
                                      )
                                      .await
                                      {
                                          warn!(?error, "failed to safely close debug window");
                                      }
                                  });
                              }
                          }
          ''',
          )
          PY

      - name: Commit exact fixes to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'lgg'
          git config user.email 'lgg@users.noreply.github.com'
          git add src/tauri/src/commands/mod.rs src/tauri/src/main.rs
          git commit -m '0028: close remaining window lifecycle gaps'
          git push origin HEAD:audit/0028-product-surface-completeness
