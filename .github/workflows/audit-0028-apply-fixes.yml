name: Audit 0028 Apply Product Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: audit-0028-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-audited-fixes:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/0028-product-surface-completeness'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: audit/0028-product-surface-completeness
          fetch-depth: 0
          show-progress: false

      - name: Apply deterministic audited patches
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if grep -q 'connectionButton.unknown' src/frontend/src/locales/en.json; then
            echo '0028 audited fixes are already applied.' | tee patch-driver.log
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          current = 'All four local windows expose explicit loading/error behavior. Settings and Happ Setup route native close requests through unsaved-draft confirmation, and asynchronous Tauri listeners are disposed safely even when registration finishes after a React surface unmounts.\n'
          expected = 'All four local windows expose explicit loading/error behavior. Settings and Happ Setup protect unsaved draft-only changes on both custom and native close requests. Async Tauri listeners are disposed even if registration finishes after React unmounts. Endpoint lists and loaded settings are normalized and bounded before use.\n'
          if text.count(current) != 1:
              raise SystemExit('README audit paragraph changed unexpectedly')
          path.write_text(text.replace(current, expected, 1), encoding='utf-8', newline='\n')
          PY
          python scripts/apply-0028-product-audit-fixes.py 2>&1 | tee patch-driver.log

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-0028-patch-diagnostics
          path: patch-driver.log
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when deterministic patching failed
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Commit audited fixes to the PR branch
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'lgg'
          git config user.email 'lgg@users.noreply.github.com'
          git add README.md project-tracking src
          git commit -m '0028: fix product surface completeness defects'
          git push origin HEAD:audit/0028-product-surface-completeness
