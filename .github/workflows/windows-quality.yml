name: Release Quality

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Confirm self-hosted runner assignment
        shell: pwsh
        run: |
          Write-Host "Runner name: ${{ runner.name }}"
          Write-Host "Runner OS: ${{ runner.os }}"
          Write-Host "Runner architecture: ${{ runner.arch }}"
          if ("${{ runner.environment }}" -ne "self-hosted") {
            throw "Release Quality must run on the self-hosted v2rayn-widget-ci runner"
          }

      - name: Verify pre-provisioned Node.js
        shell: pwsh
        run: ./scripts/assert-ci-prerequisites.ps1 -RequireNode

      - name: Verify workflow contracts
        shell: pwsh
        run: |
          $workflowLog = Join-Path $env:GITHUB_WORKSPACE "workflow-contract-output.txt"
          $installerLog = Join-Path $env:GITHUB_WORKSPACE "installer-contract-output.txt"

          node scripts/test-workflow-contracts.mjs 2>&1 | Tee-Object -FilePath $workflowLog
          $workflowExitCode = $LASTEXITCODE
          node scripts/test-installer-toolchain-contracts.mjs 2>&1 | Tee-Object -FilePath $installerLog
          $installerExitCode = $LASTEXITCODE

          if ($workflowExitCode -ne 0 -or $installerExitCode -ne 0) {
            exit 1
          }

      - name: Restore frontend dependencies locally
        id: frontend_install
        continue-on-error: true
        working-directory: src/frontend
        shell: pwsh
        run: |
          $env:NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"
          $env:NPM_CONFIG_CACHE = Join-Path $env:RUNNER_TEMP "npm-cache"
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | Tee-Object -FilePath frontend-install-output.txt
          exit $LASTEXITCODE

      - name: Verify locked Tauri CLI and immutable NSIS cache
        if: steps.frontend_install.outcome == 'success'
        id: release_prerequisites
        continue-on-error: true
        shell: pwsh
        run: ./scripts/assert-ci-prerequisites.ps1 -RequireTauriCli -RequireNsis

      - name: Audit frontend dependencies
        if: steps.frontend_install.outcome == 'success'
        id: frontend_audit
        continue-on-error: true
        working-directory: src/frontend
        shell: pwsh
        run: |
          $env:NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"
          $env:NPM_CONFIG_CACHE = Join-Path $env:RUNNER_TEMP "npm-cache"
          npm audit --audit-level=high 2>&1 | Tee-Object -FilePath frontend-audit-output.txt
          exit $LASTEXITCODE

      - name: Run frontend tests
        if: steps.frontend_install.outcome == 'success'
        id: frontend_tests
        continue-on-error: true
        working-directory: src/frontend
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath frontend-test-output.txt
          $testExitCode = $LASTEXITCODE
          $actWarnings = Select-String -Path frontend-test-output.txt -SimpleMatch "was not wrapped in act"
          if ($actWarnings) {
            Write-Error "Frontend tests emitted React act warnings"
            exit 1
          }
          exit $testExitCode

      - name: Build frontend
        if: steps.frontend_install.outcome == 'success'
        id: frontend_build
        continue-on-error: true
        working-directory: src/frontend
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object -FilePath frontend-build-output.txt
          exit $LASTEXITCODE

      - name: Upload frontend distribution
        if: steps.frontend_build.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-dist
          path: src/frontend/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-diagnostics
          path: |
            workflow-contract-output.txt
            installer-contract-output.txt
            src/frontend/frontend-install-output.txt
            src/frontend/frontend-audit-output.txt
            src/frontend/frontend-test-output.txt
            src/frontend/frontend-build-output.txt
            ${{ runner.temp }}/npm-cache/_logs/*.log
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when frontend checks failed
        if: steps.frontend_install.outcome == 'failure' || steps.release_prerequisites.outcome == 'failure' || steps.frontend_audit.outcome == 'failure' || steps.frontend_tests.outcome == 'failure' || steps.frontend_build.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Cleanup frontend workspace and cache
        if: always()
        shell: pwsh
        run: |
          Remove-Item "workflow-contract-output.txt" -Force -ErrorAction SilentlyContinue
          Remove-Item "installer-contract-output.txt" -Force -ErrorAction SilentlyContinue
          Remove-Item "src/frontend/node_modules" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "src/frontend/dist" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP "npm-cache") -Recurse -Force -ErrorAction SilentlyContinue

  rust-windows:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository)
    needs: frontend
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Confirm self-hosted runner assignment
        shell: pwsh
        run: |
          Write-Host "Runner name: ${{ runner.name }}"
          Write-Host "Runner OS: ${{ runner.os }}"
          Write-Host "Runner architecture: ${{ runner.arch }}"
          if ("${{ runner.environment }}" -ne "self-hosted") {
            throw "Release Quality must run on the self-hosted v2rayn-widget-ci runner"
          }

      - name: Download frontend distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-dist
          path: src/frontend/dist

      - name: Verify pre-provisioned Rust and MSVC
        shell: pwsh
        run: ./scripts/assert-ci-prerequisites.ps1 -RequireRust

      - name: Configure isolated Rust target directory
        shell: pwsh
        run: |
          $minimumFreeBytes = 12GB
          $drive = [System.IO.DriveInfo]::GetDrives() |
            Where-Object {
              $_.IsReady -and
              $_.DriveType -eq [System.IO.DriveType]::Fixed -and
              $_.AvailableFreeSpace -ge $minimumFreeBytes
            } |
            Sort-Object AvailableFreeSpace -Descending |
            Select-Object -First 1
          if (-not $drive) {
            throw "No local filesystem drive has at least 12 GB free for the Rust target directory"
          }

          $projectTargetRoot = Join-Path $drive.RootDirectory.FullName "github-ci-targets\v2rayn-widget"
          New-Item -ItemType Directory -Path $projectTargetRoot -Force | Out-Null
          Get-ChildItem $projectTargetRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTimeUtc -lt [DateTime]::UtcNow.AddDays(-1) } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          $targetDirectory = Join-Path $projectTargetRoot "${{ github.run_id }}-${{ github.run_attempt }}"
          Remove-Item $targetDirectory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $targetDirectory -Force | Out-Null
          "CARGO_TARGET_DIR=$targetDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_INCREMENTAL=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $freeGb = [math]::Round($drive.AvailableFreeSpace / 1GB, 2)
          Write-Host "Rust target directory: $targetDirectory on fixed drive $($drive.Name) with $freeGb GB free"

      - name: Check all Rust formatting
        id: rust_format
        continue-on-error: true
        working-directory: src/tauri
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/rust-env.ps1" -UseGlobalHomes
          cargo fmt --all -- --check 2>&1 | Tee-Object -FilePath rust-format-output.txt
          exit $LASTEXITCODE

      - name: Run Rust tests
        id: rust_tests
        continue-on-error: true
        working-directory: src/tauri
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/rust-env.ps1" -UseGlobalHomes
          cargo test --locked 2>&1 | Tee-Object -FilePath rust-test-output.txt
          exit $LASTEXITCODE

      - name: Run Rust clippy
        id: rust_clippy
        continue-on-error: true
        working-directory: src/tauri
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/rust-env.ps1" -UseGlobalHomes
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath rust-clippy-output.txt
          exit $LASTEXITCODE

      - name: Run release configuration Clippy
        id: rust_release_clippy
        continue-on-error: true
        working-directory: src/tauri
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/rust-env.ps1" -UseGlobalHomes
          cargo clippy --locked --release --no-default-features -- -D warnings 2>&1 | Tee-Object -FilePath rust-release-clippy-output.txt
          exit $LASTEXITCODE

      - name: Check Rust build
        id: rust_build
        continue-on-error: true
        working-directory: src/tauri
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/rust-env.ps1" -UseGlobalHomes
          cargo check --locked 2>&1 | Tee-Object -FilePath rust-build-output.txt
          exit $LASTEXITCODE

      - name: Build portable release smoke artifact
        id: rust_release
        continue-on-error: true
        working-directory: src/tauri
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/rust-env.ps1" -UseGlobalHomes
          cargo build --release --locked 2>&1 | Tee-Object -FilePath rust-release-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseExecutable = Join-Path $env:CARGO_TARGET_DIR "release\v2rayn-widget.exe"
          if (-not (Test-Path $releaseExecutable)) {
            Write-Error "Release executable was not produced at $releaseExecutable"
            exit 1
          }

          $portableDirectory = Join-Path $env:GITHUB_WORKSPACE "src\tauri\portable-release"
          Remove-Item $portableDirectory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portableDirectory -Force | Out-Null
          Copy-Item $releaseExecutable (Join-Path $portableDirectory "v2rayn-widget.exe") -Force

      - name: Upload portable release smoke artifact
        if: steps.rust_release.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portable-release-smoke
          path: src/tauri/portable-release/v2rayn-widget.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload Rust diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-diagnostics
          path: |
            src/tauri/rust-format-output.txt
            src/tauri/rust-test-output.txt
            src/tauri/rust-clippy-output.txt
            src/tauri/rust-release-clippy-output.txt
            src/tauri/rust-build-output.txt
            src/tauri/rust-release-output.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when Rust checks failed
        if: steps.rust_format.outcome == 'failure' || steps.rust_tests.outcome == 'failure' || steps.rust_clippy.outcome == 'failure' || steps.rust_release_clippy.outcome == 'failure' || steps.rust_build.outcome == 'failure' || steps.rust_release.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Cleanup Rust workspace
        if: always()
        shell: pwsh
        run: |
          $paths = @(
            "src/frontend/dist",
            "src/tauri/target",
            "src/tauri/portable-release"
          )
          if ($env:CARGO_TARGET_DIR) { $paths += $env:CARGO_TARGET_DIR }

          $failures = @()
          foreach ($path in $paths) {
            Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path $path) { $failures += $path }
          }
          if ($failures.Count -gt 0) {
            throw "Rust cleanup left generated paths: $($failures -join ', ')"
          }
