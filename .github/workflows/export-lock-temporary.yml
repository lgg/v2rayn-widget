name: Temporary Exact Lock Patch

on:
  push:
    branches:
      - audit/0045-preserve-profile-catalog-on-command-failure

permissions:
  contents: write

jobs:
  normalize-lock:
    runs-on: [self-hosted, v2rayn-widget-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Confirm self-hosted runner assignment
        shell: pwsh
        run: |
          if ("${{ runner.environment }}" -ne "self-hosted") {
            throw "Temporary lock normalization must run on the self-hosted runner"
          }

      - name: Normalize patched lock to repository LF format
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $path = "src/frontend/package-lock.json"
          $text = [System.IO.File]::ReadAllText($path)
          $lock = $text | ConvertFrom-Json -AsHashtable
          if ($lock.packages['node_modules/nanoid'].version -ne '3.3.17') {
            throw "Expected patched NanoID 3.3.17"
          }
          if ($lock.packages['node_modules/postcss'].version -ne '8.5.23') {
            throw "Expected patched PostCSS 8.5.23"
          }
          if ($text.Contains('nanoid-3.3.16.tgz') -or $text.Contains('postcss-8.5.21.tgz')) {
            throw "Vulnerable package URLs remain in patched lock"
          }

          $normalized = $text.Replace("`r`n", "`n").Replace("`r", "`n")
          [System.IO.File]::WriteAllText($path, $normalized, [System.Text.UTF8Encoding]::new($false))

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($path))
          $body = @{
            message = "0045: normalize audited dependency lock"
            content = $content
            sha = "cf54b2de3ff61764d6fc5c614f0e3e72052e9a88"
            branch = $env:BRANCH
          } | ConvertTo-Json
          Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/contents/$path" -Method Put -Body $body -ContentType "application/json"
